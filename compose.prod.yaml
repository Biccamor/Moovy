services:
  db:
    image: pgvector/pgvector:pg17 # PostgreSQL with pgvector support
    restart: unless-stopped
    container_name: my-postgres
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 1GB

  app:
    build:
      context: .
      target: runtime
      cache_from:
        - type=gha
      cache_to:
        - type=gha,mode=max
    container_name: app
    env_file:
      - .env
    environment:
      HF_HUB_DOWNLOAD_TIMEOUT: 60
    ports:
      - "8010:8010"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - hf_cache:/home/appuser/.cache/huggingface
      # No bind mount in production — code is baked into the image
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8010/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    read_only: false
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 6G

volumes:
  postgres_data:
  hf_cache:
