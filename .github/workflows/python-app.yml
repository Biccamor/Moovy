# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Python application

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    
    - uses: actions/checkout@v4

    - name: Create .env
      run: |
        touch .env 
        echo secret_key="tajny_klucz_do_testow" >> .env
        echo algorithm="HS256" >> .env
        echo access_token_expire=60 >> .env
        echo refresh_token_expire_days=14 >> .env
        echo DATABASE_URL="postgresql" >> .env
        echo DATABASE_URL_LOCAL="postgre.local" >> .env
        echo BEARER_TOKEN="testy123testy123" >> .env
        echo TMDB_API="TESTYETESTTETE" >> .env
        echo GROQ_API_KEY="TESTETETET" >> .env
    
    - name: Docker Setup Compose
      uses: docker/setup-compose-action@v2.1.0
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Start Services with Docker Build
      run: docker compose build --build-arg BUILDKIT_INLINE_CACHE=1 app
      env:
        COMPOSE_DOCKER_CLI_BUILD: 1
        DOCKER_BUILDKIT: 1

    - name: Start Services
      run: DOCKER_BUILDKIT=1 docker compose up -d
    
    - name: Set up Python 3.11
      uses: actions/setup-python@v3
      with:
        python-version: "3.11"
    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        docker compose exec -T app flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        docker compose exec -T app flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    - name: Test with pytest
      run: |
        docker compose exec -T app pytest
    - name: Security Scan with Bandit 
      run: | 
        docker compose exec -T app bandit -r . -x venv,__pycache__,.pytest_cache,.vscode,/test
  deploy:
      needs: build
      if: github.ref == 'refs/heads/main' && github.event_name == 'push'
      runs-on: ubuntu-latest
      steps:
        - name: Create .env for deploy
          run: |
            cat > .env.prod << EOF
            secret_key=${{ secrets.SECRET_KEY }}
            algorithm=${{ secrets.ALGORITHM }}
            access_token_expire=${{ secrets.ACCESS_TOKEN_EXPIRE }}
            refresh_token_expire_days=${{ secrets.REFRESH_TOKEN_EXPIRE_DAYS }}
            DATABASE_URL=${{ secrets.DATABASE_URL }}
            DATABASE_URL_LOCAL=${{ secrets.DATABASE_URL_LOCAL }}
            BEARER_TOKEN=${{ secrets.BEARER_TOKEN }}
            TMDB_API=${{ secrets.TMDB_API }}
            GROQ_API_KEY=${{ secrets.GROQ_API_KEY }}
            LANGFUSE_BASE_URL=${{ secrets.LANGFUSE_BASE_URL }}
            LANGFUSE_PUBLIC_KEY=${{ secrets.LANGFUSE_PUBLIC_KEY }}
            LANGFUSE_SECRET_KEY=${{ secrets.LANGFUSE_SECRET_KEY }}
            POSTGRES_DB=${{ secrets.POSTGRES_DB }}
            POSTGRES_USER=${{ secrets.POSTGRES_USER }}
            POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASS }}
            EOF

        - name: Copy .env to VM
          uses: appleboy/scp-action@v0.1.7
          with:
            host: ${{ secrets.GCP_VM_IP }}
            username: ${{ secrets.GCP_VM_USER }}
            key: ${{ secrets.GCP_SSH_PRIVATE_KEY }}
            source: ".env.prod"
            target: "/home/fabia/Moovy"

        - name: Deploy to GCP VM
          uses: appleboy/ssh-action@v1
          with:
            host: ${{ secrets.GCP_VM_IP }}
            username: ${{ secrets.GCP_VM_USER }}
            key: ${{ secrets.GCP_SSH_PRIVATE_KEY }}
            script: |
              set -e
              cd /home/fabia/Moovy
              git fetch origin main
              git reset --hard origin/main
              git pull origin main
              mv .env.prod .env
              docker compose -f compose.prod.yaml down
              docker compose -f compose.prod.yaml up -d --build